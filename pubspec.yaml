name: webdav_player
description: Sade WebDAV video oynatici (libmpv / media_kit)
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  http: ^1.2.2
  xml: ^6.5.0
  shared_preferences: ^2.3.0
  pointycastle: ^3.9.1
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 29

flutter:
  uses-material-design: true
