name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: "CMake 3.22.1 kur (indirme bozuk gelirse tekrar dene)"
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          ok=0
          for i in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/cmake/3.22.1"
            if "$SDKM" --install "cmake;3.22.1" && [ -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ]; then
              ok=1
              break
            fi
            echo "CMake kurulumu basarisiz, tekrar deneniyor ($i)..."
            sleep 10
          done
          [ "$ok" = 1 ] || exit 1
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version
      - name: Android iskeletini uret
        run: flutter create --platforms=android --org com.example --project-name webdav_player .
      - name: TV banner uret
        run: |
          pip install pillow
          mkdir -p android/app/src/main/res/drawable-xhdpi
          python3 - <<'PY'
          from PIL import Image
          icon = Image.open("assets/icon.png").convert("RGBA")
          banner = Image.new("RGBA", (320, 180), (24, 24, 24, 255))
          icon.thumbnail((140, 140))
          banner.paste(icon, ((320 - icon.width) // 2, (180 - icon.height) // 2), icon)
          banner.convert("RGB").save("android/app/src/main/res/drawable-xhdpi/tv_banner.png")
          PY
      - name: "Manifest ve minSdk (tek APK, mobil + Android TV)"
        env:
          MIN_SDK: "29"
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          # leanback/touchscreen zorunlu degil: ayni APK telefonda ve TV'de kurulabilir
          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
              '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
              '    <uses-feature android:name="android.software.leanback" android:required="false"/>\n'
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n'
          )
          app_attrs = ('android:usesCleartextTraffic="true" '
                       'android:requestLegacyExternalStorage="true" '
                       'android:banner="@drawable/tv_banner"')
          s = s.replace("<application", perms + "    <application " + app_attrs, 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="WebDAV Player"', s, count=1)
          # Hem telefon launcher'i hem TV launcher'i (LEANBACK) listelesin
          s = s.replace(
              '<category android:name="android.intent.category.LAUNCHER"/>',
              '<category android:name="android.intent.category.LAUNCHER"/>\n'
              '                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>',
              1,
          )
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
          GR=android/app/build.gradle
          [ -f "$GR" ] || GR=android/app/build.gradle.kts
          sed -i -E "s/minSdk(Version)? *(=)? *flutter\.minSdkVersion/minSdk\1 \2 ${MIN_SDK}/" "$GR"
          sed -i -E "s/minSdkVersion +flutter\.minSdkVersion/minSdkVersion ${MIN_SDK}/" "$GR"
          grep -n "minSdk" "$GR"
      - run: flutter pub get
      - name: Uygulama ikonu
        run: dart run flutter_launcher_icons
      - name: "Tek APK (armeabi-v7a + arm64-v8a)"
        run: |
          for i in 1 2; do
            flutter build apk --release \
              --target-platform android-arm,android-arm64 && exit 0
            echo "Derleme basarisiz, tekrar deneniyor ($i)..."
          done
          exit 1
      - name: Adlandir
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/webdav-player.apk
          unzip -l out/webdav-player.apk | grep -E "lib/(armeabi-v7a|arm64-v8a)/libflutter.so"
      - uses: actions/upload-artifact@v4
        with:
          name: webdav-player
          path: out/webdav-player.apk
