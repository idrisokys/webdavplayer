name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android iskeletini uret
        run: flutter create --platforms=android --org com.example --project-name webdav_player .
      - name: Manifest (internet, http, Android TV) ve minSdk 29
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          extra = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
              '    <uses-feature android:name="android.software.leanback" android:required="false"/>\n'
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n'
              '    <application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"'
          )
          s = s.replace("<application", extra, 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="WebDAV Player"', s, count=1)
          tv = '<category android:name="android.intent.category.LEANBACK_LAUNCHER"/>'
          s = s.replace(
              '<category android:name="android.intent.category.LAUNCHER"/>',
              '<category android:name="android.intent.category.LAUNCHER"/>\n                ' + tv,
              1,
          )
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
          GR=android/app/build.gradle
          [ -f "$GR" ] || GR=android/app/build.gradle.kts
          sed -i -E 's/minSdk(Version)? *(=)? *flutter\.minSdkVersion/minSdk\1 \2 29/' "$GR"
          sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 29/' "$GR"
          grep -n "minSdk" "$GR"
      - run: flutter pub get
      - name: Uygulama ikonu
        run: dart run flutter_launcher_icons
      - name: APK (sadece arm64-v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: webdav-player-android
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

