name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mobil: ARMv8 (arm64-v8a), Android 10+ (API 29)
          - name: mobile
            min_sdk: 29
            platform: android-arm64
            abi: arm64-v8a
            tv: "false"
          # Android TV: ARMv7 (armeabi-v7a), Android 12+ (API 31)
          - name: tv
            min_sdk: 31
            platform: android-arm
            abi: armeabi-v7a
            tv: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android iskeletini uret
        run: flutter create --platforms=android --org com.example --project-name webdav_player .
      - name: TV banner uret (yalnizca TV)
        if: matrix.tv == 'true'
        run: |
          pip install pillow
          mkdir -p android/app/src/main/res/drawable-xhdpi
          python3 - <<'PY'
          from PIL import Image
          icon = Image.open("assets/icon.png").convert("RGBA")
          banner = Image.new("RGBA", (320, 180), (24, 24, 24, 255))
          icon.thumbnail((140, 140))
          banner.paste(icon, ((320 - icon.width) // 2, (180 - icon.height) // 2), icon)
          banner.convert("RGB").save("android/app/src/main/res/drawable-xhdpi/tv_banner.png")
          PY
      - name: Manifest ve minSdk
        env:
          IS_TV: ${{ matrix.tv }}
          MIN_SDK: ${{ matrix.min_sdk }}
        run: |
          python3 - <<'PY'
          import os, re
          tv_build = os.environ["IS_TV"] == "true"
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
              '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
              '    <uses-feature android:name="android.software.leanback" android:required="%s"/>\n'
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n'
          ) % ("true" if tv_build else "false")
          app_attrs = 'android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"'
          if tv_build:
              app_attrs += ' android:banner="@drawable/tv_banner"'
          s = s.replace("<application", perms + "    <application " + app_attrs, 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="WebDAV Player%s"' % (" TV" if tv_build else ""), s, count=1)
          if tv_build:
              # TV'de launcher yalnizca LEANBACK_LAUNCHER ile listelenir
              s = s.replace(
                  '<category android:name="android.intent.category.LAUNCHER"/>',
                  '<category android:name="android.intent.category.LEANBACK_LAUNCHER"/>',
                  1,
              )
          else:
              s = s.replace(
                  '<category android:name="android.intent.category.LAUNCHER"/>',
                  '<category android:name="android.intent.category.LAUNCHER"/>\n'
                  '                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>',
                  1,
              )
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
          GR=android/app/build.gradle
          [ -f "$GR" ] || GR=android/app/build.gradle.kts
          sed -i -E "s/minSdk(Version)? *(=)? *flutter\.minSdkVersion/minSdk\1 \2 ${MIN_SDK}/" "$GR"
          sed -i -E "s/minSdkVersion +flutter\.minSdkVersion/minSdkVersion ${MIN_SDK}/" "$GR"
          grep -n "minSdk" "$GR"
      - run: flutter pub get
      - name: Uygulama ikonu
        run: dart run flutter_launcher_icons
      - name: APK (${{ matrix.abi }})
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform ${{ matrix.platform }} \
            --dart-define=TV=${{ matrix.tv }}
      - name: Adlandir
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk \
             out/webdav-player-${{ matrix.name }}-${{ matrix.abi }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: webdav-player-${{ matrix.name }}-${{ matrix.abi }}
          path: out/*.apk
